name: Embed Frigberry logo

on:
  push:
    paths:
      - '.github/workflows/embed-logo.yml'

permissions:
  contents: write

jobs:
  embed-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Embed logo into HTML
        shell: python
        run: |
          from pathlib import Path
          import base64

          logo = Path('frigberry-logo.webp').read_bytes()
          uri = 'data:image/webp;base64,' + base64.b64encode(logo).decode('ascii')

          for filename in ['index.html', 'bilim.html', 'dunyadansagliklireceteler.html']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('frigberry-logo.webp', uri)
              text = text.replace('frigberry-logo.svg', uri)
              text = text.replace('frigberry-logo.png', uri)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/embed-logo.yml').unlink()

      - name: Commit embedded logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Embed Frigberry logo in HTML"
          git push
