name: Mobile nav fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-nav-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mobile navigation CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacement = '''@media(max-width:900px){
            nav.navwrap{height:auto;min-height:76px;flex-wrap:wrap;padding-top:12px;padding-bottom:0}
            .brand{flex:1}
            .nav-cta{white-space:nowrap}
            nav ul{display:flex;order:3;width:100%;gap:24px;overflow-x:auto;white-space:nowrap;margin-top:12px;padding:12px 0 14px;border-top:1px solid rgba(61,26,58,.08);scrollbar-width:none;-webkit-overflow-scrolling:touch}
            nav ul::-webkit-scrollbar{display:none}
            nav ul li{flex:0 0 auto}
            nav ul a{font-size:.88rem}
          }
          @media(max-width:480px){
            nav.navwrap{padding-left:18px;padding-right:18px}
            .brand{font-size:1.1rem;gap:8px}
            .badge{width:40px;height:40px}
            .nav-cta{padding:9px 13px;font-size:.82rem}
          }'''

          targets = {
              'bilim.html': '@media(max-width:700px){nav ul{display:none}}',
              'dunyadansagliklireceteler.html': '@media(max-width:900px){nav ul{display:none}}',
          }

          for filename, old in targets.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected mobile CSS not found in {filename}')
              text = text.replace(old, replacement, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/mobile-nav-fix.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bilim.html dunyadansagliklireceteler.html .github/workflows/mobile-nav-fix.yml
          git commit -m 'Fix mobile navigation on article pages'
          git push
