name: Finalize Frigberry JPEG logo
on:
  push:
    branches: [logo-png-fix]
permissions:
  contents: write
jobs:
  finalize-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: logo-png-fix
      - name: Replace logo references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [Path('index.html'), Path('bilim.html'), Path('dunyadansagliklireceteler.html')]
          for p in files:
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'src="data:image/[^;]+;base64,[^"]+"', 'src="/frigberry-logo.jpg"', s)
              for old in [
                  'src="frigberry-logo.webp"',
                  'src="/frigberry-logo.webp"',
                  'src="frigberry-logo.png"',
                  'src="/frigberry-logo.png"'
              ]:
                  s = s.replace(old, 'src="/frigberry-logo.jpg"')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-logo-png.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html bilim.html dunyadansagliklireceteler.html .github/workflows/fix-logo-png.yml
          git commit -m "Use external JPEG logo asset"
          git push origin HEAD:logo-png-fix