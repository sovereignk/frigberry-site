name: Fix Frigberry logo PNG
on:
  push:
    branches: [logo-png-fix]
permissions:
  contents: write
jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: logo-png-fix
      - name: Convert WebP to PNG
        run: ffmpeg -y -i frigberry-logo.webp frigberry-logo.png
      - name: Replace embedded/external logo references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [Path('index.html'), Path('bilim.html'), Path('dunyadansagliklireceteler.html')]
          for p in files:
              s = p.read_text(encoding='utf-8')
              # Replace embedded image data URIs used for Frigberry logos.
              s = re.sub(r'src="data:image/[^;]+;base64,[^"]+"', 'src="/frigberry-logo.png"', s)
              # Replace previous external WebP references.
              s = s.replace('src="frigberry-logo.webp"', 'src="/frigberry-logo.png"')
              s = s.replace('src="/frigberry-logo.webp"', 'src="/frigberry-logo.png"')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-logo-png.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html bilim.html dunyadansagliklireceteler.html frigberry-logo.png .github/workflows/fix-logo-png.yml
          git commit -m "Use PNG logo asset"
          git push origin HEAD:logo-png-fix